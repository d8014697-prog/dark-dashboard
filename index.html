<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dark Dashboard</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <!-- INTRO -->
  <div id="splashScreen">
    <div class="video-intro"></div>
    <button class="skip-btn" id="btnSkipIntro">Lewati Intro ➔</button>
  </div>

  <!-- AUTH FORM -->
  <div id="authScreen">
    <div id="loginForm" class="auth-card">
      <h2 style="margin-bottom: 8px; color: #fff;">Login Sistem</h2>
      <p style="font-size: 12px; color: var(--subtext); margin-bottom: 24px;">Silakan masuk ke akun Anda.</p>
      <input type="text" id="loginUsername" class="input-style" placeholder="Username" style="text-align: center;">
      <input type="password" id="loginPassword" class="input-style" placeholder="Password" style="text-align: center;">
      <button class="action-btn" id="btnLoginSubmit">Masuk Dashboard</button>
      <p class="auth-switch">Belum punya akun? <span id="btnShowRegister">Daftar di sini</span></p>
    </div>

    <div id="registerForm" class="auth-card hide">
      <h2 style="margin-bottom: 8px; color: #fff;">Daftar Akun</h2>
      <p style="font-size: 12px; color: var(--subtext); margin-bottom: 24px;">Buat akun untuk memulai.</p>
      <input type="text" id="regUsername" class="input-style" placeholder="Username Baru" style="text-align: center;">
      <input type="password" id="regPassword" class="input-style" placeholder="Sandi (Min 8)" style="text-align: center;">
      <button class="action-btn" style="background: var(--success);" id="btnRegisterSubmit">Buat Akun</button>
      <p class="auth-switch">Sudah punya akun? <span id="btnShowLogin">Masuk di sini</span></p>
    </div>
  </div>

  <!-- SUPABASE SDK & CONFIG DATABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="databasedark.js?v=3"></script>

  <script src="script.js?v=3"></script>
</body>
</html>
